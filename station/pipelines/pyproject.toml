[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas-pipelines"
version = "0.1.0"
description = "ATLAS Station offline pipelines: `atlas case <step>` (Master Plan 10.2.4)"
requires-python = ">=3.11"
# Runtime dependencies are pinned in requirements.txt (install that first).
dependencies = [
    "numpy",
    "scipy",
    "scikit-image",
    "pydicom",
    "trimesh",
    "fast-simplification",
    "astropy",
    "astropy-healpix",
    "requests",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
atlas = "atlas_pipelines.cli:main"

[tool.setuptools.packages.find]
include = ["atlas_pipelines*"]

[tool.setuptools.package-data]
atlas_pipelines = ["steps/README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
